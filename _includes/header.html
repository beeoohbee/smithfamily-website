<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark" aria-hidden="true">S</span>
      <span class="brand-name">{{ site.title }}</span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle menu">
    <label for="nav-toggle" class="nav-toggle-label" aria-hidden="true"><span></span></label>
    <nav class="site-nav" aria-label="Main">
      {% for item in site.nav %}
        {% assign active = false %}
        {% if page.url == item.url %}{% assign active = true %}{% endif %}
        <a href="{{ item.url | relative_url }}"{% if active %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
      <a class="btn btn-small" href="mailto:{{ site.contact.email }}">Contact Us</a>
    </nav>
  </div>
</header>
