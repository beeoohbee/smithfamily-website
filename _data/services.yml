- group: Honey Bees
  id: bees
  items:
    - title: Bee Swarm & Hive Removal
      icon: "🐝"
      featured: true
      summary: >-
        Live, humane removal of swarms and established colonies from trees,
        walls, sheds, and outbuildings, relocated to our own apiary.
    - title: Local Raw Honey
      icon: "🍯"
      summary: >-
        Raw, unfiltered honey from our own hives around Cameron. Ask about
        what's available this season and pickup options.

- group: Learn Beekeeping
  id: beekeeping-lessons
  items:
    - title: Beginner Beekeeping Lessons
      icon: "📚"
      summary: >-
        Hands-on lessons covering bee biology, choosing equipment, setting up
        your first hive, and what to expect through the seasons.
    - title: One-on-One Hive Mentoring
      icon: "🧑‍🌾"
      summary: >-
        Personal tutoring at your own hives — inspections, spotting disease
        and pests, queen health, and getting your colonies through winter.
    - title: Bee Talks & Hive Visits
      icon: "🏫"
      summary: >-
        Fun, educational visits for schools, 4-H, scouts, and community
        groups to learn how honey bees live and why they matter.
