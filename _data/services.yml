# Each group shows as a section on the Services page.
# "icon" is any emoji; "featured: true" also shows the item on the homepage.
- group: For Small Businesses
  id: business
  items:
    - title: Websites & Online Presence
      icon: "🌐"
      featured: true
      summary: >-
        Simple, fast websites, Google Business Profile setup, and domain &
        email configuration so customers can find you.
    - title: IT & Tech Support
      icon: "💻"
      featured: true
      summary: >-
        Computer setup, Wi-Fi and networking, backups, security, and help
        choosing the right software for your shop or office.
    - title: Marketing & Social Media
      icon: "📣"
      summary: >-
        Logos, flyers, social media posts, and straightforward marketing
        plans that fit a small-town budget.

- group: Cookies
  id: cookies
  items:
    - title: Homemade Cookies
      icon: "🍪"
      summary: >-
        Fresh-baked cookies by the dozen — classic chocolate chip, sugar,
        oatmeal, and seasonal favorites. Just ask what's in the oven.
    - title: Custom Decorated Cookies
      icon: "🎨"
      summary: >-
        Hand-decorated cookies for birthdays, weddings, showers, holidays,
        and graduations, made to match your theme and colors.
    - title: Cookie Trays for Events
      icon: "🎉"
      summary: >-
        Cookie trays and party favors for church gatherings, school events,
        business meetings, and parties of any size.

- group: Soccer Coaching
  id: soccer
  items:
    - title: Soccer Training
      icon: "⚽"
      summary: >-
        Individual and small-group training sessions focused on ball control,
        passing, shooting, footwork, and fitness for players of all ages.
    - title: Soccer Mentoring
      icon: "🤝"
      summary: >-
        Guidance for young players on game sense, confidence, teamwork, and
        sportsmanship, plus advice on moving up to club and high school teams.

- group: Tutoring & Music Lessons
  id: tutoring
  items:
    - title: Saxophone Lessons
      icon: "🎷"
      summary: >-
        Private saxophone lessons for beginners through advanced players —
        technique, tone, reading music, and preparing for band, jazz band,
        and auditions.
    - title: Trumpet Lessons
      icon: "🎺"
      summary: >-
        Private trumpet lessons for beginners through advanced players —
        breathing, embouchure, range, reading music, and preparing for band,
        jazz band, and auditions.
    - title: Math Tutoring
      icon: "➗"
      summary: >-
        Patient help with math classes from pre-algebra and algebra through
        geometry, trigonometry, and calculus, plus homework support.
    - title: Science Tutoring
      icon: "🔬"
      summary: >-
        Tutoring for science classes like biology, chemistry, and physics,
        building real understanding instead of just memorizing.
    - title: ACT Prep & Test-Taking Strategies
      icon: "📝"
      summary: >-
        Focused ACT preparation with practice tests, plus proven strategies
        for pacing, process of elimination, and staying calm on test day.

- group: Farm & Mechanical
  id: farm-mechanical
  items:
    - title: Farm Hand Help
      icon: "🚜"
      summary: >-
        Reliable help around the farm — feeding and caring for livestock,
